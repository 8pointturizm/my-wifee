<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى آلاء ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars" id="stars"></div>

    <main class="container">

        <!-- صفحة كلمة السر -->
        <section class="login-box" id="loginPage">

            <div class="main-heart">💗</div>

            <h1>أهلاً آلاء ❤️</h1>

            <p>قبل ما تدخلي لعالمنا الصغير...</p>

            <h3>ما هو سر تعارفنا وارتباطنا؟</h3>

            <input
                type="text"
                id="password"
                placeholder="اكتبي الجواب..."
            >

            <button id="enterBtn">
                افتحي قلبي 💌
            </button>

            <p id="error"></p>

        </section>

        <!-- صفحة الحب -->
        <section class="love-box hidden" id="lovePage">

            <div class="main-heart">💖</div>

            <h1>إلى آلاء</h1>

            <p>أجمل صدفة جمعت قلبين ❤️</p>

            <h3>اختاري قلباً واكتشفي رسالتك 💕</h3>

            <div class="hearts">

<button class="love-emoji" data-message="أنتِ أجمل صدفة في حياتي ❤️">❤️</button>

<button class="love-emoji" data-message="اشتقتلك حتى وإنتِ قريبة مني 🥺">🥺</button>

<button class="love-emoji" data-message="إنتِ وردة أيامي 🌹">🌹</button>

<button class="love-emoji" data-message="ضحكتك بتسوى الدنيا 😊">😊</button>

<button class="love-emoji" data-message="وعد مني أضل أقدّرك 💍">💍</button>

<button class="love-emoji" data-message="إنتِ أجمل حكاية بحياتي 🦋">🦋</button>

<button class="love-emoji" data-message="هاي رسالة صغيرة إلك، بحبك 💌">💌</button>

<button class="love-emoji" data-message="بتمنى أكون دائماً سبب سعادتك 🫂">🫂</button>

<button class="love-emoji" data-message="إنتِ بقلبي دائماً 💋">💋</button>

<button class="love-emoji" data-message="إنتِ حلم حلو ما بدي أصحى منه 🌙">🌙</button>

</div>

            <div id="message">
                اضغطي على قلب لتكتشفي المفاجأة 💗
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
